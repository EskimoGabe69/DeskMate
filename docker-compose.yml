services:
  deskmate:
    image: deskmate:latest
    build:
      context: src
      dockerfile: Dockerfile
    environment:
      - PYGAME_DETECT_AVX2=1
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - QT_DEBUG_PLUGINS=1
      - XDG_RUNTIME_DIR=/tmp/runtime-root
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    cap_add:
      - SYS_ADMIN
    devices:
      - /dev/dri:/dev/dri

